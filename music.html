<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Music Grid</title>
  <meta name="description" content="Signal-tagged tracks and ASCII thumbnails.">
  <meta name="build-id" content="20260221-1438-sg2">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/ascii.css">
</head>
<body data-mode="exp" data-safe="off">
  <div class="surface" aria-hidden="true"></div>
  <header class="rail">
    <a href="index.html">INDEX</a>
    <span>MUSIC SIGNAL GRID</span>
    <div class="rail-controls">
      <button id="mode-toggle" type="button" class="ctl">MODE: EXPLOSION</button>
    </div>
  </header>

  <main class="section">
    <h1>MUSIC</h1>
    <p>dense signal map - filtered by emotional kinetics.</p>

    <div id="tag-filters" class="chips" role="toolbar" aria-label="Track filters">
      <button type="button" data-tag="ALL" class="chip active">ALL</button>
      <button type="button" data-tag="VOID" class="chip">VOID</button>
      <button type="button" data-tag="KINETIC" class="chip">KINETIC</button>
      <button type="button" data-tag="TENDER" class="chip">TENDER</button>
      <button type="button" data-tag="FERAL" class="chip">FERAL</button>
      <button type="button" data-tag="NOCTURNE" class="chip">NOCTURNE</button>
      <button type="button" data-tag="RITUAL" class="chip">RITUAL</button>
      <label class="ctl ctl-inline" for="external-thumbs">EXT THUMBS
        <input id="external-thumbs" type="checkbox">
      </label>
    </div>

    <section id="music-grid" class="music-grid" aria-live="polite"></section>
  </main>

  <footer class="section footer">© <span id="year"></span> Subharshi Roy; machine / memory / myth</footer>

  <script src="assets/util.js"></script>
  <script src="assets/music.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
