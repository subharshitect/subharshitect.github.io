<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/ascii.css">
  <link rel="stylesheet" href="assets/motion.css">
</head>
<body data-mode="exp" data-safe="off">
  <div class="surface" aria-hidden="true"></div>
  <header class="rail">

      <button type="button" data-tag="RITUAL" class="chip">RITUAL</button>
    </div>

    <section id="music-grid" class="music-grid" aria-live="polite"></section>

  <footer class="section footer">© <span id="year"></span> Subharshi Roy; machine / memory / myth</footer>
