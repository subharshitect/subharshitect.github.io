<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moved to Specimens</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/specimens/">
  <link rel="canonical" href="https://subharshitect.github.io/specimens/">
  <script>
    // Old links named a simulation with ?sim=…; send them to its plate, keeping their settings.
    (function () {
      var plates = { "cellular": "rule-30", "gray-scott": "gray-scott", "feedforward": "feedforward" };
      var q = new URLSearchParams(location.search);
      var plate = plates[q.get("sim")];
      location.replace(plate ? "/specimens/" + plate + ".html" + location.search : "/specimens/");
    })();
  </script>
</head>
<body>
  <p>This page has moved to <a href="/specimens/">/specimens/</a>.</p>
</body>
</html>
